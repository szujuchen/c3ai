<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crunch Calendar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">CC</span>
      <div>
        <h1>Crunch Calendar</h1>
        <p class="tag">See the crunch before it hits.</p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-role="student" role="tab">Student</button>
      <button class="tab" data-role="host" role="tab">Recruiter / Host</button>
    </nav>
  </header>

  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
